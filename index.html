<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuale Claude Code</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #efefeb;
    --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --mark: #fde68a;
    --accent: #C2603D;
    --radius: 8px; --radius-lg: 12px;
    --font: system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0efea; --text2: #a8a79f; --text3: #6e6d67;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --mark: #6b4e00;
      --accent: #D97757;
    }
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }
  .toolbar { display: flex; gap: 8px; align-items: stretch; margin-bottom: 1.25rem; }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap > i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text3); pointer-events: none; }
  input[type=text] { width: 100%; padding: 8px 36px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); font-size: 14px; font-family: var(--font); outline: none; }
  input[type=text]:focus { border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,0.12); }
  .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text2); font-size: 16px; padding: 4px; line-height: 1; }
  .news-btn { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: var(--radius); border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); font-size: 13px; font-family: var(--font); cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .news-btn:hover { color: var(--text); }
  .news-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text2); font-size: 13px; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
  .tab:hover { border-color: var(--border2); color: var(--text); }
  .tab.active { font-weight: 500; }
  .tab .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .intro-box { border-radius: 10px; padding: 12px 16px; margin-bottom: 1.25rem; font-size: 14px; line-height: 1.6; }
  .section { margin-bottom: 1.5rem; }
  .section-title { font-size: 15px; font-weight: 500; margin-bottom: 0.5rem; padding-left: 10px; border-left: 3px solid; border-radius: 0; }
  .cmd-item { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .cmd-item:last-child { border-bottom: none; }
  code.cmd { font-family: var(--mono); font-size: 13px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; display: inline-block; margin-bottom: 4px; color: var(--text); transition: color 0.2s, background 0.15s; }
  code.cmd:hover { background: var(--bg3); }
  code.cmd.copied { color: #1D9E75; }
  .cmd-desc { font-size: 14px; color: var(--text2); line-height: 1.5; }
  .new-badge { font-size: 10px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; margin-left: 6px; background: var(--accent); color: #fff; position: relative; top: -1px; }
  .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; display: inline-block; margin-bottom: 3px; }
  .result-count { font-size: 13px; color: var(--text2); margin-bottom: 1rem; }
  .no-results { font-size: 14px; color: var(--text2); }
  .footer { font-size: 11px; color: var(--text3); text-align: center; margin-top: 2.5rem; }
  .footer a { color: var(--text3); }
  mark { background: var(--mark); color: var(--text); border-radius: 3px; padding: 0 2px; }
</style>
</head>

const colors = {
  purple: { bg: "#EEEDFE", text: "#3C3489", border: "#534AB7", pill: "#AFA9EC" },
  teal:   { bg: "#E1F5EE", text: "#085041", border: "#0F6E56", pill: "#5DCAA5" },
  blue:   { bg: "#E6F1FB", text: "#0C447C", border: "#185FA5", pill: "#85B7EB" },
  amber:  { bg: "#FAEEDA", text: "#633806", border: "#854F0B", pill: "#EF9F27" },
  coral:  { bg: "#FAECE7", text: "#712B13", border: "#993C1D", pill: "#F0997B" },
  indigo: { bg: "#E8EAF9", text: "#26307A", border: "#3B47A3", pill: "#9AA3E0" },
  green:  { bg: "#EAF3DE", text: "#27500A", border: "#3B6D11", pill: "#97C459" },
  sky:    { bg: "#E2F2F7", text: "#0B4A5C", border: "#12657D", pill: "#77C3D6" },
  pink:   { bg: "#FBEAF0", text: "#72243E", border: "#993556", pill: "#ED93B1" },
  plum:   { bg: "#F3EAF7", text: "#57256E", border: "#763494", pill: "#C79BDC" },
  olive:  { bg: "#F0F2E1", text: "#414A18", border: "#5C6822", pill: "#B3BE72" },
  gray:   { bg: "#F1EFE8", text: "#444441", border: "#5F5E5A", pill: "#B4B2A9" },
};

let activeId = "avvio";
let query = "";
let onlyNew = false;

const $ = id => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, "&quot;");
}

function highlightMatch(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  const pattern = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(pattern, "gi"), m => "<mark>" + m + "</mark>");
}

function badge(item) {
  return item.n ? '<span class="new-badge">novità</span>' : "";
}

function cmdHtml(item, q) {
  return '<code class="cmd" data-cmd="' + escapeAttr(item.cmd) + '">' + highlightMatch(item.cmd, q) + "</code>" + badge(item);
}

function countNew(cat) {
  return cat.sections.reduce((n, sec) => n + sec.items.filter(i => i.n).length, 0);
}

function allItems() {
  const out = [];
  for (const cat of categories)
    for (const sec of cat.sections)
      for (const item of sec.items)
        out.push({ item: item, catLabel: cat.label, secTitle: sec.title, catColor: cat.color });
  return out;
}

function renderTabs() {
  $("tabs").innerHTML = categories.map(cat => {
    const c = colors[cat.color];
    const isActive = cat.id === activeId;
    const style = isActive
      ? "background:" + c.bg + ";color:" + c.text + ";border:1.5px solid " + c.border + ";font-weight:500"
      : "";
    const dot = countNew(cat) ? '<span class="dot" title="contiene novità"></span>' : "";
    return '<button class="tab' + (isActive ? " active" : "") + '" style="' + style + '" data-id="' + cat.id + '">' +
      '<i class="ti ' + cat.icon + '" aria-hidden="true"></i>' + escapeHtml(cat.label) + dot + "</button>";
  }).join("");
}

function renderCategory() {
  const cat = categories.find(c => c.id === activeId);
  const c = colors[cat.color];
  let html = '<div class="intro-box" style="background:' + c.bg + ";border:0.5px solid " + c.pill + ";color:" + c.text + '">' + escapeHtml(cat.intro) + "</div>";
  for (const sec of cat.sections) {
    html += '<div class="section"><h3 class="section-title" style="border-color:' + c.border + '">' + escapeHtml(sec.title) + "</h3>";
    for (const item of sec.items) {
      html += '<div class="cmd-item">' + cmdHtml(item, "") +
        '<p class="cmd-desc">' + escapeHtml(item.desc) + "</p></div>";
    }
    html += "</div>";
  }
  $("content").innerHTML = html;
}

function renderFiltered() {
  const q = query.trim().toLowerCase();
  const results = allItems().filter(r => {
    if (onlyNew && !r.item.n) return false;
    if (!q) return true;
    return r.item.cmd.toLowerCase().includes(q) || r.item.desc.toLowerCase().includes(q);
  });

  if (results.length === 0) {
    $("content").innerHTML = '<p class="no-results">Nessun risultato' +
      (q ? ' per "' + escapeHtml(query) + '"' : " tra le novità") + ".</p>";
    return;
  }

  const label = results.length === 1 ? "risultato" : "risultati";
  let html = '<p class="result-count">' + results.length + " " + label +
    (onlyNew && !q ? " · introdotte o cambiate da fine giugno 2026" : "") + "</p>";
  for (const r of results) {
    const c = colors[r.catColor];
    html += '<div style="margin-bottom:4px">' +
      '<span class="tag" style="background:' + c.bg + ";color:" + c.text + '">' +
        escapeHtml(r.catLabel) + " › " + escapeHtml(r.secTitle) + "</span>" +
      '<div class="cmd-item">' + cmdHtml(r.item, q) +
        '<p class="cmd-desc">' + highlightMatch(r.item.desc, q) + "</p></div></div>";
  }
  $("content").innerHTML = html;
}

function render() {
  const filtering = Boolean(query.trim()) || onlyNew;
  $("clear-btn").style.display = query ? "block" : "none";
  $("tabs").style.display = filtering ? "none" : "flex";
  $("news-btn").classList.toggle("on", onlyNew);
  $("news-btn").setAttribute("aria-pressed", String(onlyNew));
  if (filtering) renderFiltered(); else renderCategory();
}

function copyCmd(el) {
  const cmd = el.dataset.cmd;
  const done = () => {
    const original = el.innerHTML;
    el.textContent = "✓ copiato";
    el.classList.add("copied");
    setTimeout(() => { el.innerHTML = original; el.classList.remove("copied"); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cmd).then(done).catch(() => {});
  }
}

$("content").addEventListener("click", e => {
  const el = e.target.closest("code.cmd");
  if (el) copyCmd(el);
});

$("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  activeId = btn.dataset.id;
  query = "";
  onlyNew = false;
  $("search").value = "";
  renderTabs();
  render();
});

$("search").addEventListener("input", e => { query = e.target.value; render(); });

$("clear-btn").addEventListener("click", () => {
  query = "";
  $("search").value = "";
  $("search").focus();
  render();
});

$("news-btn").addEventListener("click", () => { onlyNew = !onlyNew; render(); });

renderTabs();
render();
</script>
