<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuale Claude Code</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #efefeb;
    --text: #1a1a18; --text2: #5f5e5a; --text3: #888780;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --mark: #fde68a;
    --radius: 8px; --radius-lg: 12px;
    --font: system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #252523; --bg3: #2e2e2b;
      --text: #f0efea; --text2: #a8a79f; --text3: #6e6d67;
      --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.2);
      --mark: #6b4e00;
    }
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }
  .search-wrap { position: relative; margin-bottom: 1.25rem; }
  .search-wrap > i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text3); pointer-events: none; }
  input[type=text] { width: 100%; padding: 8px 36px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); font-size: 14px; font-family: var(--font); outline: none; }
  input[type=text]:focus { border-color: #534AB7; box-shadow: 0 0 0 3px rgba(83,74,183,0.12); }
  .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text2); font-size: 16px; padding: 4px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text2); font-size: 13px; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
  .tab:hover { border-color: var(--border2); color: var(--text); }
  .tab.active { font-weight: 500; }
  .intro-box { border-radius: 10px; padding: 12px 16px; margin-bottom: 1.25rem; font-size: 14px; line-height: 1.6; }
  .section { margin-bottom: 1.5rem; }
  .section-title { font-size: 15px; font-weight: 500; margin-bottom: 0.5rem; padding-left: 10px; border-left: 3px solid; border-radius: 0; }
  .cmd-item { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .cmd-item:last-child { border-bottom: none; }
  code.cmd { font-family: var(--mono); font-size: 13px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; display: inline-block; margin-bottom: 4px; color: var(--text); transition: color 0.2s, background 0.15s; }
  code.cmd:hover { background: var(--bg3); }
  code.cmd.copied { color: #1D9E75; }
  .cmd-desc { font-size: 14px; color: var(--text2); line-height: 1.5; }
  .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; display: inline-block; margin-bottom: 3px; }
  .result-count { font-size: 13px; color: var(--text2); margin-bottom: 1rem; }
  .no-results { font-size: 14px; color: var(--text2); }
  .footer { font-size: 11px; color: var(--text3); text-align: center; margin-top: 2.5rem; }
  .footer a { color: var(--text3); }
  mark { background: var(--mark); color: var(--text); border-radius: 3px; padding: 0 2px; }
</style>
</head>

const colors = {

  teal:   { bg: "#E1F5EE", text: "#085041", border: "#0F6E56", pill: "#5DCAA5" },
  blue:   { bg: "#E6F1FB", text: "#0C447C", border: "#185FA5", pill: "#85B7EB" },
  amber:  { bg: "#FAEEDA", text: "#633806", border: "#854F0B", pill: "#EF9F27" },
  coral:  { bg: "#FAECE7", text: "#712B13", border: "#993C1D", pill: "#F0997B" },
  green:  { bg: "#EAF3DE", text: "#27500A", border: "#3B6D11", pill: "#97C459" },
  pink:   { bg: "#FBEAF0", text: "#72243E", border: "#993556", pill: "#ED93B1" },

};

let activeId = "avvio";

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlightMatch(text, query) {
  const safe = escapeHtml(text);
  const q = (query || "").trim();
  if (!q) return safe;
  const pattern = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(pattern, "gi"), m => `<mark>${m}</mark>`);
}

function copyCmd(el, cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    el.textContent = "✓ copiato";
    el.classList.add("copied");
    setTimeout(() => { el.textContent = cmd; el.classList.remove("copied"); }, 1500);
  });
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = categories.map(cat => {
    const c = colors[cat.color];
    const isActive = cat.id === activeId;
    const style = isActive
      ? `background:${c.bg};color:${c.text};border:1.5px solid ${c.border};font-weight:500`
      : "";
    return `<button class="tab${isActive ? " active" : ""}" style="${style}" onclick="setActive('${cat.id}')">
      <i class="ti ${cat.icon}" aria-hidden="true"></i>${cat.label}
    </button>`;
  }).join("");
}

function renderContent() {
  const cat = categories.find(c => c.id === activeId);
  const c = colors[cat.color];
  let html = `<div class="intro-box" style="background:${c.bg};border:0.5px solid ${c.pill};color:${c.text}">${cat.intro}</div>`;
  for (const sec of cat.sections) {
    html += `<div class="section"><h3 class="section-title" style="border-color:${c.border}">${sec.title}</h3>`;
    for (const item of sec.items) {
      const escaped = item.cmd.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      html += `<div class="cmd-item">
        <code class="cmd" onclick="copyCmd(this,'${escaped}')">${escapeHtml(item.cmd)}</code>
        <p class="cmd-desc">${escapeHtml(item.desc)}</p>
      </div>`;
    }
    html += `</div>`;
  }
  document.getElementById("content").innerHTML = html;
}

function setActive(id) {
  activeId = id;
  renderTabs();
  renderContent();
  document.getElementById("search").value = "";
  document.getElementById("clear-btn").style.display = "none";
}

function onSearch(val) {
  document.getElementById("clear-btn").style.display = val ? "block" : "none";
  document.getElementById("tabs").style.display = val ? "none" : "flex";
  if (!val.trim()) { renderContent(); return; }
  const q = val.toLowerCase();
  const results = [];
  for (const cat of categories) {
    for (const sec of cat.sections) {
      for (const item of sec.items) {
        if (item.cmd.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q)) {
          results.push({ ...item, catLabel: cat.label, secTitle: sec.title, catColor: cat.color });
        }
      }
    }
  }
  if (results.length === 0) {
    document.getElementById("content").innerHTML = `<p class="no-results">Nessun risultato per "${escapeHtml(val)}".</p>`;
    return;
  }
  let html = `<p class="result-count">${results.length} risultati</p>`;
  for (const item of results) {
    const c = colors[item.catColor];
    const escaped = item.cmd.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    html += `<div style="margin-bottom:4px">
      <span class="tag" style="background:${c.bg};color:${c.text}">${item.catLabel} › ${item.secTitle}</span>
      <div class="cmd-item">
        <code class="cmd" onclick="copyCmd(this,'${escaped}')">${highlightMatch(item.cmd, val)}</code>
        <p class="cmd-desc">${highlightMatch(item.desc, val)}</p>
      </div>
    </div>`;
  }
  document.getElementById("content").innerHTML = html;
}

function clearSearch() {
  document.getElementById("search").value = "";
  document.getElementById("clear-btn").style.display = "none";
  document.getElementById("tabs").style.display = "flex";
  renderContent();
}

renderTabs();
renderContent();
</script>
</body>
</html>
